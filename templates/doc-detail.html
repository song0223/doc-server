<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - API 文档</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: #f0f1f3;
            color: #1d1d1f;
            line-height: 1.6;
        }
        .layout { min-height: 100vh; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: #fff;
            border-right: 1px solid #e5e5ea;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-header {
            padding: 16px 16px 12px;
            border-bottom: 1px solid #e5e5ea;
            flex-shrink: 0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #0071e3;
            text-decoration: none;
            margin-bottom: 12px;
            transition: opacity 0.15s;
        }
        .back-link:hover { opacity: 0.7; }
        .back-link svg { width: 14px; height: 14px; }
        .sidebar-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1d1d1f;
        }
        .search-box input {
            width: 100%;
            padding: 7px 10px 7px 30px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 13px;
            background: #f5f5f7;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .search-box input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
            background: #fff;
        }
        .search-box { position: relative; }
        .search-box svg {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            stroke: #86868b;
            pointer-events: none;
        }
        .nav-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .nav-scroll::-webkit-scrollbar { width: 4px; }
        .nav-scroll::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 4px; }
        .nav-list { list-style: none; }
        .nav-list li { margin-bottom: 1px; }
        .nav-list a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            color: #6e6e73;
            text-decoration: none;
            font-size: 13px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
            line-height: 1.4;
        }
        .nav-list a:hover { background: #f5f5f7; color: #1d1d1f; }
        .nav-list a:active { transform: scale(0.98); }
        .nav-list a.active {
            background: #0071e3;
            color: #fff;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,113,227,0.25);
        }
        .nav-list a.active .method-badge { opacity: 0.9; }

        /* HTTP 方法标签 */
        .method-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .method-GET    { background: #e8f5e9; color: #2e7d32; }
        .method-POST   { background: #e3f2fd; color: #1565c0; }
        .method-PUT    { background: #fff3e0; color: #e65100; }
        .method-DELETE { background: #ffebee; color: #c62828; }
        .method-PATCH  { background: #f3e5f5; color: #7b1fa2; }
        .nav-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 内容区 ===== */
        .content {
            margin-left: 280px;
            padding: 28px 40px 64px;
            max-width: 880px;
            overflow-x: hidden;
        }

        /* Section 切换动画 */
        .section { animation: sectionIn 0.25s ease-out; }
        @keyframes sectionIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== Markdown 排版 — 紧凑 ===== */
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.4px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #0071e3;
            letter-spacing: -0.2px;
        }
        h3 {
            font-size: 15px;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 6px;
            color: #1d1d1f;
        }
        h4 {
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        p { margin-bottom: 8px; word-break: break-word; }
        a { color: #0071e3; text-decoration: none; word-break: break-all; }
        a:hover { text-decoration: underline; }

        code {
            background: #f0f1f3;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: "SF Mono", Menlo, "Cascadia Code", Consolas, monospace;
            font-size: 0.85em;
            word-break: break-all;
        }
        pre {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 14px 16px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        pre code { background: none; color: inherit; padding: 0; font-size: inherit; word-break: normal; }

        /* ===== 表格 ===== */
        .table-wrapper {
            overflow-x: auto;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #e5e5ea;
            background: #fff;
            -webkit-overflow-scrolling: touch;
        }
        .table-wrapper::-webkit-scrollbar { height: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 4px; }

        table {
            width: 100%;
            min-width: 480px;
            border-collapse: separate;
            border-spacing: 0;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }
        th {
            background: #f8f8fa;
            font-weight: 600;
            font-size: 12px;
            color: #6e6e73;
            position: sticky;
            top: 0;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        td {
            font-size: 13px;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }

        /* 长文本截断/展开 */
        td.truncate {
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            position: relative;
        }
        td.truncate::after {
            content: '';
            display: inline-block;
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 4px solid #86868b;
            margin-left: 5px;
            vertical-align: middle;
        }
        td.truncate.expanded {
            white-space: normal;
            overflow: visible;
            max-width: none;
        }
        td.truncate.expanded::after {
            border-top: none;
            border-bottom: 4px solid #86868b;
        }

        blockquote {
            border-left: 3px solid #0071e3;
            padding: 10px 14px;
            margin: 10px 0;
            background: #f8f8fa;
            border-radius: 0 6px 6px 0;
            color: #6e6e73;
            font-size: 13px;
        }
        hr {
            border: none;
            border-top: 1px solid #e8e8ed;
            margin: 16px 0;
        }
        ul, ol {
            margin: 8px 0;
            padding-left: 22px;
        }
        li { margin-bottom: 3px; }

        /* ===== 移动端 ===== */
        .mobile-top {
            display: none;
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255,255,255,0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 12px 16px;
        }
        .mobile-top .back-link { margin-bottom: 0; }
        .mobile-title {
            font-size: 15px;
            font-weight: 600;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-top { display: block; }
            .content {
                margin-left: 0;
                padding: 16px 16px 48px;
                max-width: none;
            }
            h1 { font-size: 22px; }
            h2 { font-size: 18px; }
            .table-wrapper { border-radius: 8px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                    返回文档列表
                </a>
                <div class="sidebar-title">{{.Title}}</div>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="搜索接口..." oninput="filterNav()">
                </div>
            </div>
            <div class="nav-scroll">
                <ul class="nav-list" id="navList">
                    {{range $i, $s := .Sections}}
                    {{if $s.ID}}<li><a href="#" data-index="{{$i}}" {{if eq $i 0}}class="active"{{end}}>{{if $s.Method}}<span class="method-badge method-{{$s.Method}}">{{$s.Method}}</span>{{end}}<span class="nav-name">{{$s.Name}}</span></a></li>{{end}}
                    {{end}}
                </ul>
            </div>
        </nav>

        <div class="mobile-top">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                返回文档列表
            </a>
            <div class="mobile-title">{{.Title}}</div>
        </div>

        <main class="content" id="contentArea">
            {{range $i, $s := .Sections}}
            <div class="section" id="section-{{$i}}" {{if ne $i 0}}style="display:none"{{end}}>
                {{$s.Content}}
            </div>
            {{end}}
        </main>
    </div>
    <script>
        // 搜索过滤
        function filterNav() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#navList li').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(filter) ? '' : 'none';
            });
        }

        // 点击展开/折叠截断单元格
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('truncate')) {
                e.target.classList.toggle('expanded');
            }
        });

        // 切换接口
        document.querySelectorAll('.nav-list a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const index = this.getAttribute('data-index');
                const current = document.querySelector('.section:not([style*="display:none"])');
                const target = document.getElementById('section-' + index);
                if (current === target) return;
                // 隐藏当前，显示目标（触发动画）
                if (current) current.style.display = 'none';
                if (target) {
                    target.style.display = '';
                    // 重新触发动画
                    target.style.animation = 'none';
                    target.offsetHeight; // 强制回流
                    target.style.animation = '';
                }
                document.querySelectorAll('.nav-list a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                window.scrollTo(0, 0);
            });
        });
    </script>
</body>
</html>
