<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - API 文档</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        nav {
            background: white;
            border-bottom: 1px solid #d2d2d7;
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        nav a {
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }
        nav .title {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
        }
        .content {
            background: white;
            margin: 24px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">← 返回列表</a>
        <span class="title">{{.Title}}</span>
    </nav>
    <div class="content">
        {{.Content}}
    </div>
</body>
</html>
