<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 文档中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: #f0f1f3;
            color: #1d1d1f;
            min-height: 100vh;
        }
        header {
            background: rgba(255,255,255,0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 0 32px;
            height: 52px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 28px 32px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #5e5ce6, #bf5af2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .card-icon svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
        .card-info { flex: 1; min-width: 0; }
        .card-info h2 {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-info p {
            font-size: 13px;
            color: #86868b;
        }
        .card-arrow {
            flex-shrink: 0;
            color: #c7c7cc;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .card:hover .card-arrow {
            transform: translateX(3px);
            color: #0071e3;
        }
        .empty {
            text-align: center;
            padding: 100px 20px;
            color: #86868b;
        }
        .empty-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: #e8e8ed;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-icon svg {
            width: 28px;
            height: 28px;
            fill: #aeaeb2;
        }
        .empty h2 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #6e6e73;
        }
        .empty p {
            font-size: 14px;
        }
        @media (max-width: 640px) {
            header { padding: 0 16px; }
            .container { padding: 16px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>API 文档中心</h1>
    </header>
    <div class="container">
        {{if .Docs}}
        <div class="grid">
            {{range .Docs}}
            <a href="/doc/{{.ProjectID}}" class="card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16zm0-6h3v1.5H8V10z"/></svg>
                </div>
                <div class="card-info">
                    <h2>{{.Title}}</h2>
                    <p>点击查看文档</p>
                </div>
                <div class="card-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </a>
            {{end}}
        </div>
        {{else}}
        <div class="empty">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4z"/></svg>
            </div>
            <h2>暂无文档</h2>
            <p>请先在 MacAPITester 中生成文档</p>
        </div>
        {{end}}
    </div>
</body>
</html>
