<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 文档中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }
        header {
            background: white;
            border-bottom: 1px solid #d2d2d7;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        .card p {
            font-size: 14px;
            color: #86868b;
        }
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #86868b;
        }
        .empty h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .empty p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>API 文档中心</h1>
    </header>
    <div class="container">
        {{if .Docs}}
        <div class="grid">
            {{range .Docs}}
            <a href="/doc/{{.ProjectID}}" class="card">
                <h2>{{.Title}}</h2>
                <p>点击查看文档</p>
            </a>
            {{end}}
        </div>
        {{else}}
        <div class="empty">
            <h2>暂无文档</h2>
            <p>请先在 MacAPITester 中生成文档</p>
        </div>
        {{end}}
    </div>
</body>
</html>
